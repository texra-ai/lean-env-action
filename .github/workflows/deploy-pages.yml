name: Deploy Pages

# Reusable deployment workflow shared by the Lean formalization repos:
# assembles the site from the newest component artifacts and publishes it
# with the artifact-based GitHub Pages flow. Call as
#
#   deploy:
#     permissions:
#       pages: write
#       id-token: write
#       actions: read
#     uses: texra-ai/lean-env-action/.github/workflows/deploy-pages.yml@v1
#
# Build output never enters git history; every deploy re-assembles from the
# newest component artifacts, so queued duplicates are harmless.

on:
  workflow_call:
    inputs:
      components:
        description: >-
          Space-separated component artifact names to fetch. This input controls
          fetching only: the site layout is fixed by
          scripts/assemble-pages-site.sh, which knows the three standard
          components (site-blueprint required, site-docs and site-badges
          optional). Drop a name to skip fetching that component; names the
          assembly script does not know are fetched but never enter the site.
        type: string
        default: 'site-blueprint site-docs site-badges'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Assemble and deploy Pages site
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # job.workflow_sha is the commit this reusable workflow file was resolved
      # from (native since 2026-04-23), so the scripts always match the workflow
      # revision the caller pinned (v1, main, a SHA, ...) — no separately
      # maintained ref here. actionlint does not know the property yet; see
      # .github/actionlint.yaml.
      - name: Checkout deployment scripts
        uses: actions/checkout@v7
        with:
          repository: texra-ai/lean-env-action
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts

      - name: Fetch latest site components
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          read -r -a components <<< "$COMPONENTS"
          for name in "${components[@]}"; do
            ./scripts/fetch-latest-artifact.sh "$name" "components/$name"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: ./scripts/assemble-pages-site.sh components _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
