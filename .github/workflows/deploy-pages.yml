name: Deploy Pages

# Reusable deployment workflow shared by the Lean formalization repos:
# assembles the site from the newest component artifacts and publishes it
# with the artifact-based GitHub Pages flow. Call as
#
#   deploy:
#     permissions:
#       pages: write
#       id-token: write
#       actions: read
#     uses: texra-ai/lean-env-action/.github/workflows/deploy-pages.yml@v1
#
# Build output never enters git history; every deploy re-assembles from the
# newest component artifacts, so queued duplicates are harmless.

on:
  workflow_call:
    inputs:
      components:
        description: 'Space-separated component artifact names to fetch.'
        type: string
        default: 'site-blueprint site-docs site-badges'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Assemble and deploy Pages site
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          repository: texra-ai/lean-env-action
          ref: v1
          sparse-checkout: scripts

      - name: Fetch latest site components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in ${{ inputs.components }}; do
            ./scripts/fetch-latest-artifact.sh "$name" "components/$name"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: ./scripts/assemble-pages-site.sh components _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
