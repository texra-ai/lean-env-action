name: Test actions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint action definitions
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v7
      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@v5
        with:
          path: ./actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
      - name: Run actionlint
        run: ./actionlint -color

  blueprint-deps:
    name: Build a blueprint toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install TeX / Graphviz system packages
        uses: ./blueprint-system-deps

      - name: Install leanblueprint
        uses: ./leanblueprint

      - name: Verify the toolchain is on PATH
        run: |
          set -euxo pipefail
          dot -V
          dvisvgm --version
          latexmk --version
          xelatex --version
          chktex --version
          command -v leanblueprint
          # plasTeX's import name differs from its 'plastex' PyPI name.
          python3 -c "import leanblueprint, plasTeX, pybtex; print('pybtex', pybtex.__version__)"
